[project]
name = "migration-fleet"
version = "0.1.0"
description = "Orchestrate Cursor Cloud Agents to migrate a fleet of Python services in dependency order"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

# No [build-system]: this is an application project (run via `uv run`), not a
# published package — uv manages the environment without building/installing it.

[tool.uv]
package = false
